[package]
name = "openspindle-pattern-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Parametric engraving curves, vector toolpaths and safe-by-construction NC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meval = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
