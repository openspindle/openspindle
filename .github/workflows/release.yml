# Every push to main runs release-please, which keeps a release pull request open with the next
# version and its release notes, worked out from the titles of the pull requests merged since the
# last release. Merging it tags the release and creates it as a draft; the build jobs then build,
# sign and notarize the universal Mac app and build the Windows installer, attaching both to the
# draft, and the publish job publishes it once both are there. Installed apps update to it. See
# docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, in push order. A merged release pull request whose run was superseded while
# waiting is released by the next run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check that the release app is set up
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::The release app's client ID or private key is missing; see docs/releasing.md"
            exit 1
          fi

      # Pull requests opened with the workflow's own GITHUB_TOKEN start no workflows, so the
      # release pull request would never get the checks that main requires.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Reads release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}

  build-mac:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    # The signing and notarization secrets belong to this environment, which only main deploys to.
    environment: release
    # Attaches the app to the draft release.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # No dependency cache: a signed release installs everything from the registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      - name: Build, sign and notarize
        env:
          # The Developer ID Application certificate with its private key, as a base64 .p12.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # The App Store Connect API key notarytool signs in with.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Where the app reports errors, and the token that uploads the source maps to read them.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::The signing and notarization secrets are missing; see docs/releasing.md"
            exit 1
          fi
          if [ -z "$SENTRY_DSN" ] || [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::Without SENTRY_DSN this release reports no errors, and without SENTRY_AUTH_TOKEN its reports show minified code; see docs/releasing.md"
          fi
          # electron-builder 26 takes a path to the key; v27 takes its base64 contents instead.
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          # package.json has the release's version; the run number is the build number
          # (CFBundleVersion), which only ever grows.
          npm run dist:mac -- --publish never -c.buildVersion="$BUILD_NUMBER"

      - name: Check that the app is notarized and can update
        run: |
          xcrun stapler validate release/mac-universal/OpenSpindle.app
          spctl --assess --type execute -vv release/mac-universal/OpenSpindle.app
          if [ ! -f release/latest-mac.yml ] || [ ! -f release/mac-universal/OpenSpindle.app/Contents/Resources/app-update.yml ]; then
            echo "::error::No update feed: electron-builder found no repository in package.json"
            exit 1
          fi

      # The DMG installs; installed apps update from latest-mac.yml, the zip and its blockmap.
      - name: Attach the app to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber

  build-windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    # Sentry's token belongs to this environment, which only main deploys to.
    environment: release
    # Attaches the installer to the draft release.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      # The installer's file version is the release's version and this build number.
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      # No dependency cache: a release installs everything from the registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      # Not signed yet: Windows warns before it runs an installer from the internet that no
      # certificate vouches for (docs/releasing.md).
      - name: Build
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run dist:win -- --publish never

      - name: Check that the app can update
        run: |
          if [ ! -f release/latest.yml ] || [ ! -f release/win-unpacked/resources/app-update.yml ]; then
            echo "::error::No update feed: electron-builder found no repository in package.json"
            exit 1
          fi

      # The installer installs, and installed apps update from latest.yml, the installer and its
      # blockmap.
      - name: Attach the installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" release/OpenSpindle-Setup-*.exe release/OpenSpindle-Setup-*.exe.blockmap release/latest.yml --clobber

  # The draft is published only once both apps are attached: published releases are immutable.
  publish:
    needs: [release-please, build-mac, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh release edit "$TAG" --title "OpenSpindle $VERSION" --draft=false --latest
